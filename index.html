<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Career URL Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Career URL Finder (Mt Vernon default)</h1>
        <p>
          Finds real nearby businesses from OpenStreetMap in your chosen radius. Strict mode only shows websites
          where the URL already contains <code>career</code>/<code>jobs</code> keywords.
        </p>
      </header>

      <section class="filters" aria-label="Search filters">
        <div class="field span-2">
          <label for="locationQuery">Exact location</label>
          <input
            id="locationQuery"
            type="text"
            value="Mt Vernon, Baltimore, MD"
            placeholder="e.g., Mt Vernon, Baltimore, MD"
          />
        </div>

        <div class="field">
          <label for="radiusMiles">Radius (miles)</label>
          <input id="radiusMiles" type="number" value="15" min="1" max="100" />
        </div>

        <div class="field checkbox-field">
          <label for="strictUrlToggle">Strict URL mode</label>
          <div class="checkbox-line">
            <input id="strictUrlToggle" type="checkbox" checked />
            <span>Only show URLs containing careers/jobs keywords</span>
          </div>
        </div>

        <div class="field action-field">
          <button id="searchButton" class="button" type="button">Find businesses</button>
        </div>
      </section>

      <p id="statusMessage" class="result-count"></p>
      <section>
        <h2>Business websites and career links</h2>
        <div id="businessList" class="grid" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
